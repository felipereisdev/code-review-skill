name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.2
      - name: Docs, frontmatter and SKILL.md file references
        run: bash scripts/check-docs.sh
      - name: check-docs negative tests
        run: bash scripts/test-check-docs.sh
      - name: Eval cases are well-formed (no LLM)
        run: python3 evals/run.py --validate
      - name: Eval scorer and runner tests (no LLM)
        run: python3 -m unittest discover -s evals/tests -v
